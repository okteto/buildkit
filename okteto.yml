name: buildkit

build:
  # buildx build --tag=moby/buildkit:local --output=type=docker,buildinfo-attrs=true .
  buildkit-root:
    context: .
    dockerfile: Dockerfile
    image: gcr.io/development-300207/buildkit:agustin-local
  # buildx build --target=rootless --tag=moby/buildkit:local-rootless --output=type=docker,buildinfo-attrs=true .
  buildkit-rootless:
    context: .
    dockerfile: Dockerfile
    image: gcr.io/development-300207/buildkit:agustin-local-rootless
    target: rootless


dev:
  buildkit:
    selector:
        app.kubernetes.io/component: buildkit
        app.kubernetes.io/part-of: okteto
    image: okteto/dev:latest
    command: bash
    securityContext:
      capabilities:
        add:
          - SYS_PTRACE
    volumes:
    - /go/pkg/
    - /root/.cache/go-build/
    workdir: /usr/src/app
    sync:
      - .:/usr/src/app
    forward:
      - 2345:2345
      - 8080:8080
